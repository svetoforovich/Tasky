name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build web bundle and sync into Android project
        run: |
          npm ci
          python3 build.py
          npx cap sync android

      # A fixed signing key, so a new APK installs over the old one and keeps the tasks
      - name: Use the repository's signing key
        run: mkdir -p ~/.android && cp keystore/debug.keystore ~/.android/debug.keystore

      - name: Build APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Tasky.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Tasky-apk
          path: Tasky.apk

      - name: Publish release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Tasky 1.0.${{ github.run_number }}
          body: |
            Скачайте **Tasky.apk** на телефон Android и откройте файл, чтобы установить приложение.
            Если телефон спросит, разрешите установку из этого источника.
          files: Tasky.apk
          make_latest: true
